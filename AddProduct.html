<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product | Admin Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-main: #060814;
      --surface-glass: rgba(18, 24, 43, 0.65);
      --surface-border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(168, 85, 247, 0.4);
      
      --primary: #a855f7;
      --primary-glow: rgba(168, 85, 247, 0.25);
      --secondary-indigo: #6366f1;
      --accent-rose: #f43f5e;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }
    .glow-1 {
      width: 500px;
      height: 500px;
      background: rgba(168, 85, 247, 0.12);
      top: -100px;
      left: -100px;
    }
    .glow-2 {
      width: 450px;
      height: 450px;
      background: rgba(99, 102, 241, 0.12);
      bottom: -50px;
      right: -50px;
    }

    .app-layout {
      display: flex;
      width: 100%;
      max-width: 1400px;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .sidebar {
      width: 260px;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--surface-border);
      background: rgba(10, 14, 26, 0.4);
      backdrop-filter: blur(20px);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 40px;
      color: #fff;
    }

    .brand-logo i {
      color: var(--primary);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 14px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.25s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
    }

    .nav-link.active {
      background: var(--primary-glow);
      color: var(--primary);
      border-color: rgba(168, 85, 247, 0.2);
    }

    .nav-link.logout {
      color: var(--accent-rose);
    }

    .nav-link.logout:hover {
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.2);
    }

    .main-workspace {
      flex: 1;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .form-card {
      width: 520px;
      max-width: 100%;
      background: var(--surface-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--surface-border);
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
      padding: 40px;
    }

    .header-box {
      text-align: center;
      margin-bottom: 32px;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(99, 102, 241, 0.1) 100%);
      border: 1px solid rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      box-shadow: 0 8px 20px var(--primary-glow);
    }

    .header-box h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .header-box p {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .field-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.25s ease;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px 14px 42px;
      border-radius: 14px;
      border: 1px solid var(--surface-border);
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      outline: none;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.04);
    }

    .form-control::placeholder {
      color: rgba(148, 163, 184, 0.4);
      font-weight: 400;
    }

    .form-control:focus {
      border-color: var(--primary);
      background: rgba(168, 85, 247, 0.05);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .form-control:focus + .field-icon {
      color: var(--primary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 24px var(--primary-glow);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(168, 85, 247, 0.4);
      background: linear-gradient(135deg, #c084fc 0%, #4f46e5 100%);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--surface-border);
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }

    @media (max-width: 900px) {
      .app-layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--surface-border);
      }
      .main-workspace {
        padding: 32px 16px;
      }
    }

    @media (max-width: 540px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>

<div class="app-layout">

  <aside class="sidebar">
    <div class="brand-logo">
      <i data-lucide="shield-check"></i> Control Center
    </div>

    <ul class="nav-list">
      <li>
        <a href="AdminLogin.html" class="nav-link">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
      </li>
      <li>
        <a href="AddProduct.html" class="nav-link active">
          <i data-lucide="plus-circle"></i> Add Product
        </a>
      </li>
      <li>
        <a href="ViewProductServlet" class="nav-link">
          <i data-lucide="package"></i> Inventory Catalog
        </a>
      </li>
      <li style="margin-top: auto;">
        <a href="Logout.jsp" class="nav-link logout">
          <i data-lucide="log-out"></i> Sign Out
        </a>
      </li>
    </ul>
  </aside>

  <main class="main-workspace">

    <div class="form-card">

      <div class="header-box">
        <div class="icon-box">
          <i data-lucide="package-plus" size="28"></i>
        </div>
        <h1>Add New Product</h1>
        <p>Enter details to add an item to the system inventory</p>
      </div>

      <form action="AddProductServlet" method="post">

        <div class="form-group">
          <label for="pcode">Product Code</label>
          <div class="input-wrapper">
            <input type="text" id="pcode" name="pcode" class="form-control" placeholder="e.g. PRD-101" required autocomplete="off">
            <i data-lucide="qr-code" size="18" class="field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="pname">Product Name</label>
          <div class="input-wrapper">
            <input type="text" id="pname" name="pname" class="form-control" placeholder="e.g. Wireless Ergonomic Mouse" required>
            <i data-lucide="tag" size="18" class="field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="pcomp">Manufacturer / Company</label>
          <div class="input-wrapper">
            <input type="text" id="pcomp" name="pcomp" class="form-control" placeholder="e.g. Logitech" required>
            <i data-lucide="building-2" size="18" class="field-icon"></i>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="pprice">Price ($)</label>
            <div class="input-wrapper">
              <input type="number" step="0.01" id="pprice" name="pprice" class="form-control" placeholder="0.00" required>
              <i data-lucide="dollar-sign" size="18" class="field-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="pqty">Quantity</label>
            <div class="input-wrapper">
              <input type="number" id="pqty" name="pqty" class="form-control" placeholder="0" required>
              <i data-lucide="layers" size="18" class="field-icon"></i>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <i data-lucide="plus-circle" size="18"></i>
          <span>Add To Inventory</span>
        </button>

      </form>

      <div class="footer">
        Admin Product Management System © 2026
      </div>

    </div>

  </main>

</div>

<script>
  lucide.createIcons();
</script>

</body>
</html>
