<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Core | Security Gateway</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-deep: #030712;
            --surface-card: rgba(15, 23, 42, 0.75);
            --surface-panel: rgba(30, 41, 59, 0.5);
            --surface-border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(168, 85, 247, 0.4);

            --accent-primary: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.35);
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;

            --text-heading: #f8fafc;
            --text-body: #cbd5e1;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-deep);
            color: var(--text-body);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle Animated Background Grid */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        /* Ambient Glow Spheres */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
        .glow-1 {
            width: 500px;
            height: 500px;
            background: rgba(168, 85, 247, 0.15);
            top: -100px;
            left: -100px;
        }
        .glow-2 {
            width: 450px;
            height: 450px;
            background: rgba(6, 182, 212, 0.12);
            bottom: -100px;
            right: -100px;
        }
        .glow-cursor {
            width: 320px;
            height: 320px;
            background: rgba(168, 85, 247, 0.08);
            position: fixed;
            top: 0;
            left: 0;
            margin-top: -160px;
            margin-left: -160px;
            pointer-events: none;
            z-index: 0;
            filter: blur(100px);
        }

        
        .portal-wrapper {
            position: relative;
            z-index: 1;
            width: 900px;
            max-width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.25fr;
            background: var(--surface-card);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        
        .brand-panel {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
            border-right: 1px solid var(--surface-border);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .brand-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-cyan));
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 8px 18px var(--accent-glow);
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-heading);
            letter-spacing: -0.3px;
        }

        .brand-body {
            margin: 40px 0;
        }

        .brand-body h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.25;
            color: var(--text-heading);
            margin-bottom: 12px;
        }

        .brand-body p {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-emerald);
            box-shadow: 0 0 10px var(--accent-emerald);
        }

        
        .form-panel {
            padding: 44px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 28px;
        }

        .form-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 4px;
        }

        .form-header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-control {
            width: 100%;
            padding: 13px 42px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-heading);
            outline: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-control::placeholder {
            color: rgba(100, 116, 139, 0.5);
        }

        .form-control:focus {
            background: rgba(168, 85, 247, 0.04);
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .form-control:focus ~ .field-icon {
            color: var(--accent-primary);
        }

        .form-control.invalid-input {
            border-color: var(--accent-rose);
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15);
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.2s ease;
        }

        .toggle-btn:hover {
            color: var(--text-heading);
        }

        .error-msg {
            color: #fca5a5;
            font-size: 11.5px;
            font-weight: 600;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 16px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, #6366f1 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 22px var(--accent-glow);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(168, 85, 247, 0.45);
            background: linear-gradient(135deg, #c084fc 0%, #4f46e5 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer-text {
            margin-top: 24px;
            text-align: center;
            font-size: 11.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        
        @media (max-width: 768px) {
            .portal-wrapper {
                grid-template-columns: 1fr;
            }
            .brand-panel {
                padding: 28px;
            }
            .brand-body {
                margin: 20px 0;
            }
            .form-panel {
                padding: 32px 28px;
            }
        }
    </style>
</head>

<body>

<div class="grid-bg"></div>
<div class="ambient-glow glow-1" id="glow1"></div>
<div class="ambient-glow glow-2" id="glow2"></div>
<div class="ambient-glow glow-cursor" id="glowCursor"></div>

<main class="portal-wrapper">

   
    <section class="brand-panel">
        <div class="brand-header">
            <div class="brand-logo">
                <i data-lucide="shield-check" size="22"></i>
            </div>
            <span class="brand-title">Aegis Core</span>
        </div>

        <div class="brand-body">
            <h2>Administrative Management Gateway</h2>
            <p>Access high-privilege dashboard services, system telemetry, and store inventories.</p>
        </div>

        <div class="system-status">
            <span class="status-dot"></span>
            <span>Security Layer: Active (TLS 1.3)</span>
        </div>
    </section>

    <!-- Right Login Form Panel -->
    <section class="form-panel">

        <div class="form-header">
            <h1>Authenticate Admin</h1>
            <p>Enter your system authorization credentials</p>
        </div>

        <form action="eAdminLogin" method="post" id="adminLoginForm" onsubmit="return validateAdminLogin(event)">

            <!-- Username Field -->
            <div class="form-group">
                <div class="form-label">
                    <span>Username</span>
                    <span id="unameCount" style="color: var(--text-muted); font-weight: 500;"></span>
                </div>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="uname" 
                        name="uname" 
                        class="form-control" 
                        placeholder="e.g. admin_sys" 
                        autocomplete="username" 
                        oninput="validateField('uname')">
                    <i data-lucide="user" size="18" class="field-icon"></i>
                </div>
                <div id="unameError" class="error-msg"></div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <div class="form-label">
                    <span>Password</span>
                </div>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="upwd" 
                        name="upwd" 
                        class="form-control" 
                        placeholder="••••••••••••" 
                        autocomplete="current-password" 
                        oninput="validateField('upwd')">
                    <i data-lucide="lock" size="18" class="field-icon"></i>
                    <button type="button" class="toggle-btn" onclick="togglePasswordVisibility()" title="Toggle visibility">
                        <i data-lucide="eye" id="pwdToggleIcon" size="18"></i>
                    </button>
                </div>
                <div id="upwdError" class="error-msg"></div>
            </div>

            <!-- Submit Action -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <i data-lucide="log-in" size="18"></i>
                <span>Authorize Credentials</span>
            </button>

        </form>

        <footer class="footer-text">
            <i data-lucide="lock" size="12"></i>
            <span>Encrypted Administration System &copy; 2026</span>
        </footer>

    </section>

</main>

<script>
    
    lucide.createIcons();

    
    document.addEventListener("mousemove", (e) => {
        const x = e.clientX;
        const y = e.clientY;

        const glowCursor = document.getElementById("glowCursor");
        glowCursor.style.transform = `translate(${x}px, ${y}px)`;

        const moveX = (x - window.innerWidth / 2) * 0.02;
        const moveY = (y - window.innerHeight / 2) * 0.02;

        document.getElementById("glow1").style.transform = `translate(${moveX}px, ${moveY}px)`;
        document.getElementById("glow2").style.transform = `translate(${-moveX}px, ${-moveY}px)`;
    });

   
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById("upwd");
        const toggleIcon = document.getElementById("pwdToggleIcon");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.setAttribute("data-lucide", "eye-off");
        } else {
            passwordInput.type = "password";
            toggleIcon.setAttribute("data-lucide", "eye");
        }
        lucide.createIcons();
    }

    
    function validateField(fieldName) {
        if (fieldName === 'uname') {
            const input = document.getElementById("uname");
            const val = input.value.trim();
            const errorElement = document.getElementById("unameError");

            if (val === "") {
                setError(input, errorElement, "Username credential is required");
            } else if (val.length < 3) {
                setError(input, errorElement, "Username must contain at least 3 characters");
            } else if (!/^[A-Za-z0-9_]+$/.test(val)) {
                setError(input, errorElement, "Only alphanumeric characters and underscores allowed");
            } else {
                clearError(input, errorElement);
            }
        }

        if (fieldName === 'upwd') {
            const input = document.getElementById("upwd");
            const val = input.value.trim();
            const errorElement = document.getElementById("upwdError");

            if (val === "") {
                setError(input, errorElement, "Security password is required");
            } else if (val.length < 6) {
                setError(input, errorElement, "Password must be at least 6 characters");
            } else {
                clearError(input, errorElement);
            }
        }
    }

    function setError(input, errorElement, message) {
        input.classList.add("invalid-input");
        errorElement.innerHTML = `<i data-lucide="alert-circle" size="13"></i> ${message}`;
        lucide.createIcons();
    }

    function clearError(input, errorElement) {
        input.classList.remove("invalid-input");
        errorElement.innerHTML = "";
    }

    
    function validateAdminLogin(event) {
        validateField('uname');
        validateField('upwd');

        const unameError = document.getElementById("unameError").innerText.trim();
        const upwdError = document.getElementById("upwdError").innerText.trim();

        if (unameError !== "" || upwdError !== "") {
            event.preventDefault();
            return false;
        }

       
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.style.opacity = "0.8";
        submitBtn.innerHTML = `<i data-lucide="loader" size="18" class="spin"></i> Authenticating...`;
        lucide.createIcons();
        return true;
    }
</script>

</body>
</html>
