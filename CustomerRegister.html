<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: linear-gradient(135deg, #050816 0%, #0f172a 35%, #1e1b4b 70%, #311042 100%);
            --card: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.18);
            --input: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.72);
            --blue: #38bdf8;
            --btn1: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --btn2: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            --shadow: 0 30px 70px rgba(0, 0, 0, 0.42);
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px 18px;
            color: var(--text);
            overflow-x: hidden;
            background: var(--bg);
            background-size: 300% 300%;
            animation: gradientShift 16s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: 0;
        }

        body::before {
            background: #3b82f6;
            top: 8%;
            left: 8%;
        }

        body::after {
            background: #9333ea;
            bottom: 8%;
            right: 8%;
        }

        .register-card {
            position: relative;
            z-index: 1;
            width: 560px;
            max-width: 100%;
            padding: 40px 34px 30px;
            border-radius: 32px;
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: var(--shadow);
            text-align: center;
            animation: fadeUp 0.8s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .icon-header {
            width: 72px;
            height: 72px;
            margin: 0 auto 12px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            font-size: 34px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
        }

        h2 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.6px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 26px;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
            letter-spacing: 0.3px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 14px;
            border: 1px solid var(--input-border);
            background: var(--input);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        input:focus {
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.11);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.22);
        }

        input.input-error {
            border-color: var(--error);
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.25);
        }

        .error-message {
            display: none;
            color: #fca5a5;
            font-size: 11px;
            font-weight: 600;
            margin-top: 5px;
            line-height: 1.3;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 14px;
            background: var(--btn1);
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 12px 24px rgba(29, 78, 216, 0.3);
        }

        .btn-submit:hover {
            background: var(--btn2);
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(29, 78, 216, 0.45);
        }

        .login-link-wrapper {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            color: var(--muted);
        }

        .login-link-wrapper a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 800;
        }

        .login-link-wrapper a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        @media (max-width: 580px) {
            .register-card {
                padding: 30px 18px 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: span 1;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="icon-header">📝</div>
    <h2>Customer Registration</h2>
    <p class="subtitle">Create your account to browse products and place orders securely.</p>

    <form id="registerForm" action="register" method="post" novalidate>
        <div class="form-grid">
            <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" placeholder="John" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" placeholder="Doe" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="uname">Username</label>
                <input type="text" id="uname" name="uname" placeholder="johndoe123" required autocomplete="off">
                <div id="unameError" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="pword">Password</label>
                <input type="password" id="pword" name="pword" placeholder="••••••••" required>
                <div id="pwordError" class="error-message"></div>
            </div>

            <div class="form-group full-width">
                <label for="addr">Address</label>
                <input type="text" id="addr" name="addr" placeholder="Enter your full address" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="mid">Email Address</label>
                <input type="email" id="mid" name="mid" placeholder="john@example.com" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="phone">Mobile Number</label>
                <input type="text" id="phone" name="phone" placeholder="9876543210" required autocomplete="off">
            </div>
        </div>

        <input type="submit" value="Register" class="btn-submit">
    </form>

    <div class="login-link-wrapper">
        Already have an account? <a href="CustomerLogin.html">Login here</a>
    </div>

    <div class="footer">
        Customer Portal System © 2026
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        let isValid = true;

        const unameInput = document.getElementById('uname');
        const pwordInput = document.getElementById('pword');

        const unameError = document.getElementById('unameError');
        const pwordError = document.getElementById('pwordError');

        unameInput.classList.remove('input-error');
        pwordInput.classList.remove('input-error');
        unameError.style.display = 'none';
        pwordError.style.display = 'none';

        const unameValue = unameInput.value.trim();
        const unameRegex = /^[a-zA-Z0-9_]{3,20}$/;

        if (!unameValue) {
            unameError.textContent = 'Username is required.';
            unameInput.classList.add('input-error');
            unameError.style.display = 'block';
            isValid = false;
        } else if (!unameRegex.test(unameValue)) {
            unameError.textContent = 'Username must be 3-20 characters long and contain only letters, numbers, or underscores.';
            unameInput.classList.add('input-error');
            unameError.style.display = 'block';
            isValid = false;
        }

        const pwordValue = pwordInput.value;
        const pwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

        if (!pwordValue) {
            pwordError.textContent = 'Password is required.';
            pwordInput.classList.add('input-error');
            pwordError.style.display = 'block';
            isValid = false;
        } else if (!pwordRegex.test(pwordValue)) {
            pwordError.textContent = 'Password must be at least 8 characters long and contain 1 uppercase letter, 1 lowercase letter, 1 number, and 1 special character (@$!%*?&).';
            pwordInput.classList.add('input-error');
            pwordError.style.display = 'block';
            isValid = false;
        }

        if (!isValid) {
            e.preventDefault();
        }
    });

    ['uname', 'pword'].forEach(id => {
        document.getElementById(id).addEventListener('input', function () {
            this.classList.remove('input-error');
            const errorDiv = document.getElementById(id + 'Error');
            if (errorDiv) errorDiv.style.display = 'none';
        });
    });
</script>

</body>
</html>
